name: Bug
description: Something behaved differently from how it is documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The commands you ran, in order.
      render: shell
    validations: { required: true }
  - type: textarea
    id: status
    attributes:
      label: Output of `dispatch status` and `dispatch blocked`
      description: >
        Redact anything private. `dispatch log --limit 60` often has the answer
        too, especially for a card that is stuck.
      render: shell
  - type: input
    id: version
    attributes:
      label: dispatch version, OS, and Python
      placeholder: "dispatch 0.1.0, macOS 15, Python 3.12"
    validations: { required: true }

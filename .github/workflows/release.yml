name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: version
        name: the tag and the package version must agree
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::tag $TAG says $VERSION but pyproject says $PKG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: the changelog must describe this version
        run: |
          python - "${{ steps.version.outputs.version }}" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
                        text, re.S | re.M)
          if not m or not m.group(1).strip():
              sys.exit(f"CHANGELOG.md has no entry for {version}")
          open("RELEASE_NOTES.md", "w").write(m.group(1).strip() + "\n")
          print(f"release notes: {len(m.group(1).strip().splitlines())} lines")
          PY

      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - name: the artifact has to work where no source exists
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/clean/bin/dispatch --version
          /tmp/clean/bin/dispatch docs | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            RELEASE_NOTES.md

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: dispatch ${{ needs.build.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false

  # Publishing to PyPI needs a one-time setup: create the project there and add
  # this repo as a trusted publisher (PyPI → Publishing → Add a new pending
  # publisher), then create a `pypi` environment on this repo. Until that
  # exists the job is skipped and the GitHub Release is the distribution.
  pypi:
    needs: [build, release]
    if: vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: rm -f RELEASE_NOTES.md
      - uses: pypa/gh-action-pypi-publish@release/v1
